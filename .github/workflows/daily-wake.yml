# External keep-alive for Render Free. Scheduled workflows run from default branch.
# GitHub Actions scheduled jobs may run late; availability is best effort.
name: Daytime backend keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daytime-backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping during NZ daytime and evening
        env:
          BACKEND_URL: https://easyride-backend-2bxw.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # TZ automatically accounts for New Zealand daylight saving.
          NZ_TIME="$(TZ=Pacific/Auckland date +%H:%M)"
          NZ_HOUR="$(TZ=Pacific/Auckland date +%H)"
          echo "New Zealand time: $NZ_TIME"
          # Runs from 06:00 through 00:59; intentionally pauses 01:00-05:59.
          if (( 10#$NZ_HOUR >= 1 && 10#$NZ_HOUR < 6 )); then
            echo "Scheduled sleep window (01:00-06:00 NZ); skipping."
            exit 0
          fi
          if [[ -z "$BACKEND_URL" ]]; then
            echo "::error::BACKEND_URL missing. Set a GitHub Actions repository secret or variable to the Render backend base URL."
            exit 1
          fi
          BASE="${BACKEND_URL%/}"
          if [[ ! "$BASE" =~ ^https://[^/]+$ ]]; then
            echo "::error::BACKEND_URL must be an HTTPS base URL, without an /api path."
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 100 "$BASE/api/health"
          echo
          # Keep the existing backup check where configured, once in the 6am hour.
          if [[ "$NZ_HOUR" == "06" && -n "$CRON_SECRET" && "$NZ_TIME" == 06:0* ]]; then
            curl --fail --silent --show-error --max-time 100 \
              -X POST -H "X-Cron-Secret: $CRON_SECRET" "$BASE/api/cron/backup"
            echo
          fi
