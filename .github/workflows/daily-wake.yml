# Wakes the backend at 6am NZ time and runs the scheduled-backup check.
#
# Render's free plan puts the server to sleep when nobody is using the site,
# and while it's asleep its hourly backup check never runs. This calls
# POST /api/cron/backup (backend/routes/cron.js) every day, which wakes the
# server and sends the weekly backup if one is due - otherwise it does
# nothing.
#
# Needs two repository secrets (GitHub > Settings > Secrets and variables >
# Actions):
#   BACKEND_URL  - the Render backend address, e.g. https://easyride-api.onrender.com
#   CRON_SECRET  - any long random string; set the same value as CRON_SECRET
#                  in the Render service's environment variables.
name: Daily backend wake-up

on:
  schedule:
    # 6am NZ time, which also starts the server's own 6am-11pm keep-awake
    # pings (backend/utils/keepAwake.js). Two runs because cron here is UTC:
    # 17:00 UTC = 6am NZDT (summer), 18:00 UTC = 6am NZST (winter) - the
    # other run is harmless, the backup only sends when one is due. GitHub
    # may run scheduled jobs a little late at busy times.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend and run backup check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the BACKEND_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          # A sleeping free-plan server can take up to about a minute to
          # start, so allow a long timeout and a few retries.
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "${BACKEND_URL%/}/api/cron/backup"
          echo
